const C={x:cp.x+W/2,y:cp.y+H/2};
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-cl(x),3),back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ctr=e=>({x:e.p.x+W/2,y:e.p.y+H/2});
// arrow k goes from block k to block k+1 through the gap between them
function arrowPts(k){const a=EL[k],b=EL[(k+1)%8];const A=ctr(a),B=ctr(b);
  if(Math.abs(A.y-B.y)<1){const y=A.y+20,x1=A.x<B.x?a.p.x+W:a.p.x,x2=A.x<B.x?b.p.x:b.p.x+W;return [x1-14*Math.sign(x2-x1),y,x2+14*Math.sign(x2-x1),y];}
  const x=A.x,y1=A.y<B.y?a.p.y+H:a.p.y,y2=A.y<B.y?b.p.y:b.p.y+H;return [x,y1-14*Math.sign(y2-y1),x,y2+14*Math.sign(y2-y1)];}
window.render=function(t){
  const tb=window.LOOP?1:t;
  core.style.setProperty('--s',back(tb/0.07));core.style.setProperty('--g',(26+14*Math.sin(t*6.283*3))+'px');
  let svg='<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FAFAFA"/></marker></defs>';
  const jt=window.LOOP?Math.min(1,t/0.88):(t-0.5)/0.5; // journey 0..1
  const step=Math.floor(cl(jt)*8.999);
  EL.forEach((e,k)=>{
    const st=0.06+k*0.05,p=ease((tb-st)/0.06);e.d.style.setProperty('--o',p);e.d.style.setProperty('--y',((1-p)*24)+'px');
    e.tools.forEach((tl,j)=>{const ts=st+0.03+j*0.006;tl.style.setProperty('--s',back((tb-ts)/0.04));tl.style.setProperty('--o',cl((tb-ts)/0.02));});
    // spoke from centre to block
    const B=ctr(e),sp=ease((tb-0.46)/0.05);
    if(sp>0){svg+=`<line x1="${C.x}" y1="${C.y}" x2="${C.x+(B.x-C.x)*sp}" y2="${C.y+(B.y-C.y)*sp}" stroke="${e.c}" stroke-opacity=".55" stroke-width="3" stroke-dasharray="8 8" stroke-dashoffset="${-t*300}"/>`;}
    // journey highlight
    const on=jt>=0&&k===step;const g=on?Math.sin(cl((jt*8.999-k))*Math.PI):0;
    e.d.style.setProperty('--gw',(4*g).toFixed(1)+'px');e.d.style.setProperty('--gb',(30*g).toFixed(0)+'px');
  });
  // arrow badges in the gaps, 1→8 and 8→centre
  let top='';
  const badge=(x,y,ang,col,a,lit)=>{const s=(0.6+0.4*back(a))*(lit?1.12:1);
    return `<g transform="translate(${x},${y}) scale(${s.toFixed(3)}) rotate(${ang})" opacity="${cl(a*1.5).toFixed(2)}"><circle r="21" fill="${lit?'#FFFFFF':col}" stroke="#0A0A0A" stroke-width="4"/><path d="M-7,-9 L5,0 L-7,9" fill="none" stroke="${lit?col:'#FFFFFF'}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`;};
  for(let k=0;k<8;k++){const a=EL[k];let x,y,ang;
    if(k<7){const b=EL[k+1],A=ctr(a),B=ctr(b);
      if(Math.abs(A.y-B.y)<1){y=A.y;x=(A.x<B.x)?(a.p.x+W+b.p.x)/2:(b.p.x+W+a.p.x)/2;ang=A.x<B.x?0:180;}
      else{x=A.x;y=(A.y<B.y)?(a.p.y+H+b.p.y)/2:(b.p.y+H+a.p.y)/2;ang=A.y<B.y?90:-90;}}
    else{const A=ctr(a);y=A.y;x=(a.p.x+W+cp.x)/2;ang=0;}
    const ap=(tb-0.4-k*0.012)/0.05;if(ap<=0)continue;
    top+=badge(x,y,ang,a.c,cl(ap),jt>=0&&step>k);}
  // a data dot travels the journey path, on top of the blocks
  if(jt>=0&&jt<0.97){const f=jt*8.999,k=Math.min(7,Math.floor(f)),u=f-k;const A=ctr(EL[k]);const B=k<7?ctr(EL[k+1]):C;
    const px=A.x+(B.x-A.x)*ease(u),py=A.y+(B.y-A.y)*ease(u);
    top+=`<circle cx="${px}" cy="${py}" r="16" fill="#22D3EE" opacity=".35"/><circle cx="${px}" cy="${py}" r="8" fill="#fff" stroke="#22D3EE" stroke-width="3"/>`;}
  document.getElementById('top').innerHTML=top;
  document.getElementById('fx').innerHTML=svg;
};
if(location.hash==='#static')window.render(1);
</script></body></html>
