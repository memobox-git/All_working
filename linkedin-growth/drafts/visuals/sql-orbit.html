  nodes.appendChild(b);nodes.appendChild(l);P.push({ri,i,x,y,b,l,n:ring.length,ph:Math.random()*6.283});
}));
// pipelines that hop between tools: [ring,index] chains
const FLOWS=[[[0,1],[1,0],[2,0]],[[0,0],[1,1],[2,2]],[[0,2],[2,6]],[[0,2],[2,7]],[[2,14],[2,15]],[[1,7],[2,11]],[[1,2],[2,4]]];
const find=(r,i)=>P.find(p=>p.ri===r&&p.i===i);

window.render=function(t){

  core.style.setProperty('--s',back(t/0.08));core.style.setProperty('--g',(40+18*Math.sin(t*6.283*3))+'px');
  let svg='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FAFAFA"/></marker></defs>';
  [0,1,2].forEach(ri=>{svg+=`<circle cx="${CX}" cy="${CY}" r="${R[ri]}" fill="none" stroke="rgba(255,255,255,${0.07*ease((t-0.05)/0.1)})" stroke-width="2"/>`});
  P.forEach((p,k)=>{
    const start=0.06+p.ri*0.1+p.i*(0.1/p.n);
    const s=back((t-start)/0.06);const o=cl((t-start)/0.03);
    const fl=Math.sin(t*6.283*2+p.ph)*4*cl((t-0.45)/0.1);
    p.b.style.setProperty('--s',s);p.b.style.setProperty('--o',o);p.l.style.setProperty('--o',cl((t-start-0.03)/0.05));
    p.b.style.top=(p.y+fl)+'px';p.l.style.top=(p.y+fl+D[p.ri]/2+5)+'px';
    // spoke + packet
    const sp=ease((t-0.38-k*0.003)/0.07);
    if(sp>0){
      const ex=CX+(p.x-CX)*sp,ey=CY+(p.y+fl-CY)*sp;
      svg+=`<line x1="${CX}" y1="${CY}" x2="${ex}" y2="${ey}" stroke="${COL[p.ri]}" stroke-opacity=".28" stroke-width="2" stroke-dasharray="6 8" stroke-dashoffset="${(k%2?1:-1)*t*280}"/>`;
      const out=k%2===0;let u=((t*3+rnd(k+1))%1);if(!out)u=1-u;
      const fade=Math.sin(Math.PI*u);
      const px=CX+(p.x-CX)*u,py=CY+(p.y+fl-CY)*u;

    }
  });
  // pipeline arrows, each draws then travels
  FLOWS.forEach((f,fi)=>{
    const st=0.44+fi*0.035;const g=ease((t-st)/0.08);if(g<=0)return;
    for(let j=0;j<f.length-1;j++){
      const a=find(...f[j]),b=find(...f[j+1]);
      const ax=a.x,ay=a.y,bx=b.x,by=b.y,mx=(ax+bx)/2,my=(ay+by)/2;
      const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
      const cx=mx-dy*0.25,cy=my+dx*0.25;

      svg+=`<path d="${d}" fill="none" stroke="#FAFAFA" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${Math.max(0,L*g - shrink)} ${L*2}"/>`;
      if(g>=1){const u=((t-st-0.08)*3.2+j*0.5)%1,q=1-u;const px=q*q*ax+2*q*u*cx+u*u*bx,py=q*q*ay+2*q*u*cy+u*u*by;
        svg+=`<circle cx="${px}" cy="${py}" r="9" fill="#22D3EE" opacity=".35"/><circle cx="${px}" cy="${py}" r="5.5" fill="#FFFFFF"/>`;}
    }
  });

};
