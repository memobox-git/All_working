const nodes=document.getElementById('nodes'),fx=document.getElementById('fx');
const P=[];let k=0;
CAP.forEach((n,ri)=>{const off=-90+(ri%2)*(180/n);for(let i=0;i<n&&k<TOOLS.length;i++,k++){
  const a=(off+i*360/n)*Math.PI/180,x=CX+RR[ri]*Math.cos(a),y=CY+RR[ri]*Math.sin(a);
  const b=document.createElement('div');b.className='b';b.style.width=b.style.height=DD[ri]+'px';b.style.left=x+'px';b.style.top=y+'px';b.title=TOOLS[k].n;
  b.innerHTML=`<img src="${TOOLS[k].src}">`;b.style.boxShadow=`0 0 0 2px ${COL[ri]}99`;
  nodes.appendChild(b);P.push({ri,i,n,x,y,b,ph:(k*2.399)%6.283});}});
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-cl(x),3),back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

const ARCS=[];for(let j=0;j<14;j++){const a=Math.floor(rnd(j+3)*P.length),b=Math.floor(rnd(j+50)*P.length);if(a!==b&&P[a].ri!==P[b].ri)ARCS.push([a,b]);}

  const core=document.getElementById('core');core.style.setProperty('--s',back(t/0.07));core.style.setProperty('--g',(36+16*Math.sin(t*6.283*3))+'px');

  let shown=0;
  P.forEach((p,j)=>{
    const st=0.06+p.ri*0.075+p.i*(0.07/p.n);const s=back((t-st)/0.05);if(t>st+0.02)shown++;
    const fl=Math.sin(t*6.283*2+p.ph)*2.5*cl((t-0.45)/0.1);
    p.b.style.setProperty('--s',s);p.b.style.setProperty('--o',cl((t-st)/0.025));p.b.style.top=(p.y+fl)+'px';

        svg+=`<circle cx="${CX+(p.x-CX)*u}" cy="${CY+(p.y+fl-CY)*u}" r="3.2" fill="${COL[p.ri]}" opacity="${(0.95*fd*sp).toFixed(2)}"/>`;}}

    if(g>=1){const u=((t-st-0.07)*3+j*0.37)%1,q=1-u;svg+=`<circle cx="${q*q*A.x+2*q*u*cx+u*u*B.x}" cy="${q*q*A.y+2*q*u*cy+u*u*B.y}" r="4" fill="#fff"/>`;}
  });
  fx.innerHTML=svg;
  document.getElementById('cn').textContent=Math.min(P.length,shown);document.getElementById('ct').style.setProperty('--o',ease((t-0.05)/0.05));
};
