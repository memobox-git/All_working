<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Free DE YouTube Hub</title>
<style>
  @font-face { font-family: "Poppins"; src: url(fonts/Poppins_500.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Poppins"; src: url(fonts/Poppins_700.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: "Poppins"; src: url(fonts/Poppins_800.woff2) format("woff2"); font-weight: 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: "Poppins", sans-serif; color: #1d1d1f; position: relative;
    background:
      radial-gradient(circle at 12% 88%, rgba(255,196,214,.55) 0 120px, transparent 121px),
      radial-gradient(circle at 92% 14%, rgba(196,226,255,.6) 0 140px, transparent 141px),
      radial-gradient(circle, rgba(29,29,31,.10) 1.6px, transparent 1.8px) 0 0 / 28px 28px,
      #fbf7f0; }
  .title { position: absolute; left: 70px; right: 70px; top: 40px; background: #fff; border: 4px solid #1d1d1f; border-radius: 18px;
    box-shadow: 10px 10px 0 #1d1d1f; padding: 22px 26px 20px; text-align: center; }
  .title h1 { font-weight: 800; font-size: 52px; line-height: 1.04; letter-spacing: -.5px; }
  .title h1 .z { background: #ffd86b; padding: 0 12px; border-radius: 10px; }
  .title p { font-weight: 500; font-size: 25px; margin-top: 10px; color: #444; }
  svg.lines { position: absolute; inset: 0; }
  .hub { position: absolute; width: 214px; height: 214px; border-radius: 50%; background: #ffd86b; border: 4px solid #1d1d1f;
    box-shadow: 8px 8px 0 #1d1d1f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .play { width: 112px; height: 78px; background: #ff3b30; border-radius: 22px; position: relative; }
  .play::after { content: ""; position: absolute; left: 44px; top: 21px; border-left: 32px solid #fff; border-top: 18px solid transparent; border-bottom: 18px solid transparent; }
  .hub span { font-weight: 800; font-size: 24px; }
  .card { position: absolute; width: 250px; min-height: 140px; border: 3.5px solid #1d1d1f; border-radius: 24px; box-shadow: 7px 7px 0 #1d1d1f;
    padding: 16px 16px 14px 20px; }
  .card.hide { visibility: hidden; }
  .card.now { transform: scale(1.07); }
  .num { position: absolute; left: -20px; top: -20px; width: 48px; height: 48px; border-radius: 50%; background: #1d1d1f; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 25px; border: 3px solid #fbf7f0; }
  .sk { font-weight: 700; font-size: 25px; line-height: 1.12; }
  .ch { font-weight: 500; font-size: 20px; line-height: 1.3; margin-top: 6px; color: #2c2c2e; white-space: nowrap; }
  .ch div::before { content: "▸ "; color: #ff3b30; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #1d1d1f; color: #fff; display: flex; align-items: center;
    justify-content: space-between; padding: 0 34px; }
  .foot .who { font-weight: 700; font-size: 25px; }
  .foot .who small { font-weight: 500; color: #ffd86b; margin-left: 8px; }
  .foot .line { font-weight: 700; font-size: 25px; color: #ffd86b; }
  .foot .line.hide { visibility: hidden; }
</style>
</head>
<body>
<div class="title">
  <h1>Learn data engineering for <span class="z">$0</span></h1>
  <p>9 skills · the best free YouTube channels · in this order</p>
</div>
<svg class="lines" width="1080" height="1350" id="lines"></svg>
<div id="cards"></div>
<div class="hub" id="hub"><div class="play"></div><span>YouTube</span></div>
<div class="foot"><div class="who">Crispus Roshan<small>Stackle</small></div><div class="line hide" id="closing">Watching is free. Building gets you hired.</div></div>
<script>
const STEPS = [
  ["SQL", ["Data with Baraa", "Ankit Bansal"]],
  ["Python", ["Corey Schafer", "freeCodeCamp.org"]],
  ["Data modeling & warehousing", ["Data with Baraa", "Zach Wilson"]],
  ["Spark & PySpark", ["Ansh Lamba", "Databricks"]],
  ["Airflow", ["Marc Lamberti", "Astronomer"]],
  ["dbt", ["dbt Labs"]],
  ["Kafka & streaming", ["Confluent", "Stephane Maarek"]],
  ["Cloud projects (AWS, Azure)", ["Darshil Parmar", "Ansh Lamba"]],
  ["System design", ["ByteByteGo", "Gaurav Sen"]],
];
const FILL = ["#e4dcff", "#d4f3e2", "#ffd9e2", "#ffe3c7", "#d6ecff", "#fff3b8", "#e4dcff", "#d4f3e2", "#ffd9e2"];
const LINE = ["#7b61ff", "#1f9d61", "#e0457b", "#e98a1f", "#2f86d6", "#c9a400", "#7b61ff", "#1f9d61", "#e0457b"];
const p = new URLSearchParams(location.search);
const step = parseInt(p.get("step") ?? "99");   // 0 = title + hub, 1..9 = cards, 10 = closing line
const CX = 540, CY = 760;
const POS = [[540,340],[850,430],[900,690],[870,960],[690,1170],[390,1170],[210,960],[180,690],[230,430]];
const hub = document.getElementById("hub");
hub.style.left = (CX - 107) + "px"; hub.style.top = (CY - 107) + "px";
let svg = "", html = "";
STEPS.forEach((s, i) => {
  const [x, y] = POS[i];
  const shown = i < step;
  if (shown) svg += `<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="${LINE[i]}" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>`;
  const cls = shown ? (i === step - 1 && step <= 9 ? "card now" : "card") : "card hide";
  html += `<div class="${cls}" style="left:${x - 125}px; top:${y - 75}px; background:${FILL[i]}">
      <div class="num">${i + 1}</div><div class="sk">${s[0]}</div><div class="ch">${s[1].map(c => `<div>${c}</div>`).join("")}</div></div>`;
});
document.getElementById("lines").innerHTML = svg;
document.getElementById("cards").innerHTML = html;
if (step >= 10) document.getElementById("closing").classList.remove("hide");
</script>
</body>
</html>
