<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.steps{display:grid;grid-template-columns:repeat(5,1fr);margin-top:96px;position:relative}
.rail{position:absolute;left:10%;right:10%;top:62px;height:6px;background:var(--blue);border-radius:3px}
.st{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.st .n{width:128px;height:128px;border-radius:50%;background:var(--white);border:5px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800}
.st .l{font-size:38px;font-weight:800;margin-top:28px;line-height:1.2;max-width:300px}
.st.key .n{background:var(--yellow)}
.say{margin-top:120px;display:flex;flex-direction:column;gap:16px}
.weak{font-size:42px;font-weight:700;color:var(--muted)}
.strong{font-size:50px;font-weight:800;letter-spacing:-.01em}
</style></head>
<!-- Graphic 16: the five parts of a story -->
<body data-dur="9" data-steps="4.0,6.6">
<div class="stage">
  <div class="kicker" data-in="0.1" data-fx="left"><i></i>Getting your stories right</div>
  <div class="h1" data-in="0.3">Every story gets the same five parts</div>
  <div class="steps">
    <div class="rail" data-grow="0.6"></div>
    <div class="st" data-in="0.9" data-fx="scale"><div class="n">1</div><div class="l">The situation</div></div>
    <div class="st key" data-in="1.5" data-fx="scale"><div class="n">2</div><div class="l">The decision</div></div>
    <div class="st" data-in="2.1" data-fx="scale"><div class="n">3</div><div class="l">The trade-off</div></div>
    <div class="st" data-in="2.7" data-fx="scale"><div class="n">4</div><div class="l">The result</div></div>
    <div class="st" data-in="3.3" data-fx="scale"><div class="n">5</div><div class="l">What I’d do differently</div></div>
  </div>
  <div class="say">
    <div class="weak" data-in="4.6">A weak story is about what happened.</div>
    <div class="strong" data-in="5.4">A strong story is about <span class="mark" data-hl="6.0">what you decided, and why</span>.</div>
  </div>
</div>
<div class="foot" data-in="0" data-fx="fade"><span></span><span class="site">joinstackle<i>.</i>com</span></div>
<script src="../base.js"></script><script src="engine.js"></script></body></html>
