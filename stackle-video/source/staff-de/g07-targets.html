<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:52px}
.tile{background:var(--white);border:3px solid var(--line);border-radius:30px;padding:36px 44px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}
.tile b{font-size:100px;font-weight:800;letter-spacing:-.03em;line-height:1}
.tile span{font-size:32px;font-weight:600;color:var(--muted);margin-top:14px;line-height:1.25}
.tile.hi{background:var(--blue);border-color:var(--blue);color:var(--white)} .tile.hi span{color:#D6E0FF}
.tile.pj{background:var(--yellow);border-color:var(--yellow)} .tile.pj span{color:var(--ink)}
</style></head>

<body data-dur="7.5" data-steps="1.4,2.2,3.0,3.8,4.6,5.4">
<div class="stage">
  <div class="kicker" data-in="0.1" data-fx="left"><i></i>My targets</div>
  <div class="h1" data-in="0.3">By January 3</div>
  <div class="tiles">
    <div class="tile" data-in="0.8" data-fx="scale"><b>120–150</b><span>DSA problems</span></div>
    <div class="tile" data-in="1.6" data-fx="scale"><b>40–50</b><span>advanced SQL problems</span></div>
    <div class="tile hi" data-in="2.4" data-fx="scale"><b>15+</b><span>system designs</span></div>
    <div class="tile" data-in="3.2" data-fx="scale"><b>20+</b><span>debugging scenarios</span></div>
    <div class="tile" data-in="4.0" data-fx="scale"><b>10</b><span>stories from my own work</span></div>
    <div class="tile pj" data-in="4.8" data-fx="scale"><b>1</b><span>real project: a distributed AI platform</span></div>
  </div>
</div>
<div class="foot" data-in="0" data-fx="fade"><span></span><span class="site">joinstackle<i>.</i>com</span></div>
<script src="../base.js"></script><script src="engine.js"></script></body></html>
