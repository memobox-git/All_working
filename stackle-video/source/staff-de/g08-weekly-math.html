<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.head{display:flex;align-items:center;gap:24px}
.head .h1{margin-top:0;font-size:72px}
.lines{margin-top:48px;display:flex;flex-direction:column;gap:22px}
.ln{font-size:48px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:20px;white-space:nowrap}
.ln .op{color:var(--muted);font-weight:600}
.ln .res{background:var(--blue-soft);color:var(--blue);font-weight:800;padding:2px 16px;border-radius:12px}
.ln .res.y{background:var(--yellow);color:var(--ink)}
.bars{margin-top:56px;display:flex;flex-direction:column;gap:18px}
.bar-row{display:grid;grid-template-columns:560px 1fr;align-items:center;gap:30px}
.bar-row label{font-size:30px;font-weight:800;line-height:1.2}
.bar-row label small{display:block;font-size:22px;color:var(--muted);font-weight:600;margin-top:4px}
.track{height:66px;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:14px;display:flex;align-items:center;justify-content:flex-end;padding-right:24px;font-size:30px;font-weight:800;white-space:nowrap}
.f1{background:var(--blue);color:var(--white);width:calc(7.5 / 8 * 100%)}
.f2{background:var(--line);color:var(--ink);width:calc(6.5 / 8 * 100%)}
</style></head>
<!-- Graphic 8: the weekly math, one line at a time, then the comparison with the 2025 study -->
<body data-dur="13" data-steps="1.4,3.4,5.4,7.8,10.8">
<div class="stage">
  <div class="head">
    <div class="letssay" data-in="0.1" data-fx="left">Let’s say</div>
    <div class="h1" data-in="0.2">The weekly math</div>
  </div>
  <div class="lines">
    <div class="ln" data-in="0.6" data-fx="left">150 DSA <span class="op">÷</span> 15 weeks <span class="op">=</span> <span class="res">10 a week</span> <span class="op">=</span> <span class="res">2 a weekday</span></div>
    <div class="ln" data-in="2.6" data-fx="left">45 SQL <span class="op">÷</span> 15 weeks <span class="op">=</span> <span class="res">3 a week</span></div>
    <div class="ln" data-in="4.6" data-fx="left">15 designs <span class="op">÷</span> 15 weeks <span class="op">=</span> <span class="res">1 a week</span></div>
    <div class="ln" data-in="7.0" data-fx="left">2 problems <span class="op">×</span> 45 minutes <span class="op">=</span> <span class="res">1.5 hours a day</span> <span class="op">=</span> <span class="res y">7.5 hours a week</span></div>
  </div>
  <div class="bars">
    <div class="bar-row" data-in="9.0" data-fx="fade"><label>This plan<small>DSA alone</small></label><div class="track"><div class="fill f1" data-grow="9.2">7.5 hours a week</div></div></div>
    <div class="bar-row" data-in="9.8" data-fx="fade"><label>Average prep time in a 2025 study<small>131 people, all prep, in total</small></label><div class="track"><div class="fill f2" data-grow="10.0">about 6.5 hours a week</div></div></div>
  </div>
</div>
<div class="foot" data-in="0" data-fx="fade"><span>Study: arxiv.org/abs/2507.02068 (2025, 131 people)</span><span class="site">joinstackle<i>.</i>com</span></div>
<script src="../base.js"></script><script src="engine.js"></script></body></html>
