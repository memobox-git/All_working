<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.rows{display:flex;flex-direction:column;gap:26px;margin-top:56px}
.r{display:flex;align-items:center;gap:40px;border:3px solid var(--line);border-radius:30px;padding:30px 44px;background:var(--white)}
.badge{width:132px;height:132px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:800;flex:none}
.badge svg{width:64px;height:64px}
.t{font-size:80px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.r1{border:4px solid var(--blue)} .r1 .badge{background:var(--yellow)}
.r2 .badge{background:var(--blue-soft);color:var(--blue)}
.r3{background:var(--blue);border-color:var(--blue);color:var(--white)} .r3 .badge{background:var(--white)}
.r3 small{display:block;font-size:26px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:8px}
.r3 .t{font-size:72px}
</style></head>
