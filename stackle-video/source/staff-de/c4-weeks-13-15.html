<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.r{margin-top:28px;display:flex;gap:22px;align-items:flex-start}
.r .chip{font-size:24px;flex:none;margin-top:6px}
.r b{display:block;font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.r span{display:block;font-size:24px;font-weight:600;color:var(--muted);margin-top:6px;line-height:1.3}
.plus{margin-top:30px;border-top:3px solid var(--line);padding-top:22px;font-size:26px;font-weight:800;display:flex;gap:14px;align-items:center}

<div class="card">
  <div class="kicker"><i></i>Block four</div>
  <div class="r"><span class="chip ink">Week 13</span><div><b>Debugging</b><span>Find and fix a broken system</span></div></div>
  <div class="r"><span class="chip blue">Weeks 14–15</span><div><b>Interview mode</b><span>Full mock interviews, out loud, with a timer running</span></div></div>
  <div class="plus"><i>+</i>One practice round where AI is allowed</div>
</div>
<script src="../base.js"></script><script src="engine.js"></script></body></html>
