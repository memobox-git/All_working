<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.lbl{font-size:26px;font-weight:700;color:var(--muted);margin-top:30px}
.amt{display:inline-block;font-size:76px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:10px;padding:6px 18px;border-radius:16px}
.a1{background:var(--blue-soft);color:var(--blue)} .a2{background:var(--yellow)}
.base{font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:12px}
.down{display:block;width:44px;height:52px;margin:22px 0 0 26px}
</style></head>
<!-- Card beside Chris, opening: "Senior data engineer, Meta: about $220K base" -> "Staff data jobs at AI companies: $350K–$400K+ base" -->
<body class="card-page" data-dur="1">
<div class="card">
  <div class="kicker"><i></i>Base salary, US</div>
  <div class="lbl">Senior data engineer, Meta</div>
  <div><span class="amt a1">about $220K</span></div>
  <svg class="down" viewBox="0 0 44 52"><path d="M22 4v40M8 30l14 14 14-14" fill="none" stroke="#0B0B0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="lbl" style="margin-top:14px">Staff data jobs at AI companies</div>
  <div><span class="amt a2">$350K–$400K+</span></div>
  <div class="src">Levels.fyi, Meta E5 data engineer average base; posted pay ranges at Anthropic and OpenAI. Oct 2026.</div>
</div>
<script src="../base.js"></script><script src="engine.js"></script></body></html>
