<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.t{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-top:24px}
.copies{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.cp{border:3px solid var(--line);border-radius:20px;padding:18px 10px 16px;text-align:center}
.cp svg{width:54px;height:62px}
.cp b{display:block;font-size:24px;font-weight:800;margin-top:8px}
.cp span{display:block;font-size:19px;font-weight:600;color:var(--muted)}
.down{display:block;width:40px;height:46px;margin:18px auto 0}
.one{margin-top:14px;background:var(--blue);color:var(--white);border-radius:22px;padding:22px 28px;display:flex;align-items:center;gap:22px}
.one svg{width:54px;height:62px;flex:none}
.one b{display:block;font-size:34px;font-weight:800}
.one span{display:block;font-size:22px;font-weight:600;color:#D6E0FF;margin-top:4px}
</style></head>
<!-- Card beside Chris, Part 1: "3 teams, 3 copies of the same customer data" -> one shared table -->
<body class="card-page" data-dur="1">
<svg width="0" height="0" style="position:absolute"><defs><symbol id="db" viewBox="0 0 54 62"><ellipse cx="27" cy="11" rx="23" ry="8" fill="none" stroke="currentColor" stroke-width="4"/><path d="M4 11v40c0 4.4 10.3 8 23 8s23-3.6 23-8V11M4 31c0 4.4 10.3 8 23 8s23-3.6 23-8" fill="none" stroke="currentColor" stroke-width="4"/></symbol></defs></svg>
<div class="card">
  <div class="kicker"><i></i>Let’s say</div>
  <div class="t">3 teams, 3 copies of the same customer data</div>
  <div class="copies">
    <div class="cp"><svg style="color:#5A5F6E"><use href="#db"/></svg><b>Team A</b><span>own copy</span></div>
    <div class="cp"><svg style="color:#5A5F6E"><use href="#db"/></svg><b>Team B</b><span>own copy</span></div>
    <div class="cp"><svg style="color:#5A5F6E"><use href="#db"/></svg><b>Team C</b><span>own copy</span></div>
  </div>
  <svg class="down" viewBox="0 0 40 46"><path d="M20 4v34M8 26l12 12 12-12" fill="none" stroke="#0B0B0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="one"><svg style="color:#FFCC1A"><use href="#db"/></svg><div><b>1 shared table</b><span>All 3 teams agree to use it</span></div></div>
</div>
<script src="../base.js"></script><script src="engine.js"></script></body></html>
