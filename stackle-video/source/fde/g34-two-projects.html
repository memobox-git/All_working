<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="fde.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="theme-base.css">
<style>.pj{position:absolute;top:360px;width:780px;height:600px}
.btn{display:inline-block;border-radius:14px;padding:12px 26px;font-size:30px;font-weight:800}</style></head><body>
<div class="grid"></div><div class="phasebar" data-cur="5"></div>
<div class="scene" style="padding-top:150px"><div class="tag" data-in="0.4" data-fx="left">Phase 5</div>
  <div class="h1" style="font-size:84px" data-in="0.6">Two portfolio projects</div></div>
<div class="pj card" style="left:160px" data-in="3.4">
  <div class="small">Project 1</div><div class="h2" style="font-weight:800;margin-top:6px">RAG assistant</div>
  <div class="row" style="gap:20px;margin-top:30px" data-in="6.6"><i class="ic" data-ic="docs" style="width:70px;height:70px;color:var(--text);transform:rotate(-8deg)"></i><i class="ic" data-ic="pdf" style="width:70px;height:70px;color:var(--text);transform:rotate(6deg)"></i><i class="ic" data-ic="sheet" style="width:70px;height:70px;color:var(--text);transform:rotate(-4deg)"></i><span class="h3">messy, real documents</span></div>
  <div style="margin-top:50px" data-in="8.6"><div class="h3">an eval score you can show</div>
    <div style="height:30px;background:var(--dim);border-radius:15px;margin-top:20px"><div style="height:100%;background:var(--accent);border-radius:15px" data-bar="0.9" data-bin="9.0"></div></div></div>
</div>
<div class="pj card hot" style="left:980px" data-in="11.0" data-fx="right">
  <div class="small">Project 2</div><div class="h2" style="font-weight:800;margin-top:6px">Agent</div>
  <div class="row" style="gap:16px;margin-top:22px" data-in="13.8"><span class="h3">connects to a real system</span></div>
  <div class="row" style="gap:16px;margin-top:12px"><span class="h3 mute" data-in="17.0">through</span><span class="pill solid" data-in="17.0">API</span><span class="h3 mute" data-in="17.2">or</span><span class="pill solid" data-in="17.4">MCP</span></div>
  <div class="card" style="margin-top:24px;padding:20px 28px" data-in="19.4">
    <div class="row" style="gap:18px"><i class="ic" data-ic="user" style="width:56px;height:56px;color:var(--text)"></i><span class="h3">A person approves each action</span></div>
    <div class="row" style="gap:16px;margin-top:16px"><span class="btn lit" style="border:3px solid var(--accent)" data-glow="21.0">Approve</span><span class="btn" style="border:3px solid var(--dim);color:var(--mute)">Reject</span></div>
  </div>
</div>
<div class="brand">stackle.io</div>
<script src="fde.js"></script><script src="../base.js"></script></body></html>
