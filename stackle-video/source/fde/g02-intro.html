<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"></head><body>
<!-- Same design as ../intro.html, re-timed to the FDE script's intro lines at 150 words a minute -->
<div class="grid"></div><div class="ring" data-spin="6"></div>
<div class="beat"><div class="tag" data-in="0.2" data-out="3.6" data-fx="left">If you are new here</div>
  <div class="h1" data-in="0.6" data-out="3.6">I am <span class="amber">Chris.</span></div></div>
<div class="beat"><div class="big amber" data-in="3.8" data-out="8.0" data-fx="scale"><span data-count="10" data-cin="3.8" data-suffix="+"></span></div>
  <div class="h2" data-in="4.1" data-out="8.0">years in data engineering</div>
  <div class="bar" data-bar="0.55" data-bin="4.2" data-in="4.1" data-out="8.0"></div></div>
<div class="beat"><div class="big amber" data-in="8.2" data-out="14.8" data-fx="scale"><span data-count="200" data-cin="8.2" data-suffix="+"></span></div>
  <div class="h2" data-in="8.5" data-out="14.8">engineers interviewed</div>
  <div class="chips"><div class="chip" data-in="11.4" data-out="14.8">Healthcare</div><div class="chip" data-in="11.8" data-out="14.8">Banking</div>
  <div class="chip" data-in="12.2" data-out="14.8">Automotive</div><div class="chip" data-in="12.8" data-out="14.8">Financial exchanges</div></div></div>
<div class="beat"><div class="tag" data-in="15.0" data-out="19.2" data-fx="left">Today I run</div>
  <div class="big" data-in="15.2" data-out="19.2" data-fx="scale">Stackle<span class="amber">.</span></div>
  <div class="sub" data-in="16.6" data-out="19.2">where I teach data and AI engineering</div></div>
<div class="beat"><div class="big amber" data-in="19.4" data-fx="scale"><span data-count="200000" data-cin="19.4" data-suffix="+"></span></div>
  <div class="h2" data-in="19.7">people follow me on LinkedIn</div></div>
<div class="brand" data-in="0" data-fx="fade">stackle.io</div>
<script src="../base.js"></script></body></html>
