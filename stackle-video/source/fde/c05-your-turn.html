<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="fde.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="theme-base.css">
<!-- Replaces on-camera scene 5. Cues 1-5 are beats. -->
<style>.st{position:absolute;left:160px;right:160px;height:120px;display:flex;align-items:center;gap:30px;padding:0 40px}
.st .k{font-size:44px;font-weight:800;color:var(--accent);width:50px}
.st .ic{width:60px;height:60px;color:var(--accent)}
.st .t{font-size:46px;font-weight:700}</style></head><body>
<div class="grid"></div>
<div class="scene"><div class="tag" data-in="0.2" data-fx="left">Your turn</div>
  <div class="h1" style="font-size:84px" data-in="1">One thing to do <span class="amber">this week</span></div></div>
<div class="abs card st" style="top:330px" data-in="2"><div class="k">1</div><i class="ic" data-ic="user"></i><div class="t">Find one person with a problem at work</div></div>
<div class="abs card st" style="top:480px" data-in="3"><div class="k">2</div><i class="ic" data-ic="clock"></i><div class="t">Talk to them for <span class="amber">30 minutes</span></div></div>
<div class="abs card st" style="top:630px" data-in="4"><div class="k">3</div><i class="ic" data-ic="doc"></i><div class="t">Write a <span class="amber">one-page</span> problem statement</div></div>
<div class="abs h3" style="left:160px;top:820px;font-size:46px" data-in="5">That page is the start of your <span class="amber">first FDE project</span>.</div>
<div class="brand">stackle.io</div>
<script src="fde.js"></script><script src="../base.js"></script></body></html>
