<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="fde.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="theme-base.css">
<style>.ln{font-size:34px;font-weight:700;display:flex;gap:18px;align-items:baseline}.ln b{color:var(--accent)}</style></head><body>
<div class="grid"></div><div class="phasebar" data-cur="3"></div>
<div class="scene" style="padding-top:150px"><div class="tag" data-in="0.4" data-fx="left">Phase 3</div>
  <div class="h1" style="font-size:84px" data-in="0.6">Applied AI</div>
  <div class="body" style="margin-top:8px" data-in="3.8">A model can only be as good as the information you give it.</div></div>
<div class="abs row" style="left:160px;top:430px;gap:30px">
  <div class="card hot row" style="gap:20px;padding:26px 36px" data-in="9.4"><i class="ic icon-amber" data-ic="check" style="width:54px;height:54px"></i><div class="h3">Build with models that already exist</div></div>
  <div class="card row" style="gap:20px;padding:26px 36px" data-in="13.8"><i class="ic icon-mute" data-ic="x" style="width:54px;height:54px"></i><div class="h3 mute">Train your own</div></div>
</div>
<div class="abs card" style="left:160px;top:590px;width:700px;height:340px" data-in="15.0">
  <div class="row" style="gap:24px;margin-top:20px"><div class="col center" style="gap:8px"><i class="ic" data-ic="screen" style="width:96px;height:96px;color:var(--text)"></i><div class="small" style="font-size:26px">your app</div></div>
    <svg width="170" height="40"><path class="arrow" d="M5 20H160M146 8l14 12-14 12" data-draw="15.8"></path></svg>
    <div class="col center" style="gap:8px" data-in="16.2"><i class="ic icon-amber" data-ic="cpu" style="width:96px;height:96px"></i><div class="h3" style="font-size:34px">LLM API</div></div></div>
  <div class="h3" style="margin-top:26px;font-size:38px;white-space:nowrap" data-in="19.8">Clear instructions = <span class="amber" data-in="22.6">prompting</span></div>
</div>
<div class="abs card hot" style="left:900px;top:600px;width:860px;height:330px" data-in="23.0" data-fx="right">
  <div class="small" style="margin-bottom:20px">A good prompt says</div>
  <div class="col" style="gap:22px">
    <div class="ln"><b>1</b><span data-type="25.4" data-tps="40">who the assistant is helping</span></div>
    <div class="ln"><b>2</b><span data-type="27.4" data-tps="40">what to answer</span></div>
    <div class="ln"><b>3</b><span data-type="29.0" data-tps="40">what to say when it does not know</span></div>
  </div>
</div>
<div class="brand">stackle.io</div>
<script src="fde.js"></script><script src="../base.js"></script></body></html>
