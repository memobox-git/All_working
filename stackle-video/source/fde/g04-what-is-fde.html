<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="fde.css">
<style>
.panel{position:absolute;top:400px;width:760px;height:520px}
.dots{position:absolute;left:330px;top:120px;width:380px;display:grid;grid-template-columns:repeat(8,1fr);gap:16px}
.dots i{width:28px;height:28px;border-radius:50%;background:var(--soft);display:block}
.prod{position:absolute;left:50px;top:170px;width:200px;height:200px;border:4px solid var(--amber);border-radius:28px;display:flex;align-items:center;justify-content:center}
.fdeb{position:absolute;left:40px;top:120px;width:300px;height:330px;border:4px solid var(--amber);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.links{position:absolute;left:420px;top:110px;display:flex;flex-direction:column;gap:34px}
</style></head><body>
<div class="grid"></div>
<div class="scene">
  <div class="tag" data-in="0.2" data-fx="left">Forward deployed engineer (FDE)</div>
  <div class="h2" style="font-size:70px;font-weight:800;max-width:1500px" data-in="0.6">A software developer who works <span class="amber">inside one customer&rsquo;s business</span></div>
</div>
<div class="panel card fadeg" style="left:160px" data-in="9.4" data-glow="15.4">
  <div class="h3 mute">Most developers</div>
  <div class="prod"><i class="ic icon-amber" data-ic="box" style="width:110px;height:110px"></i></div>
  <svg class="abs" style="left:250px;top:250px;width:90px;height:20px;overflow:visible"><path class="arrow" d="M5 10 H80 M66 0 L80 10 L66 20" data-draw="10.0"></path></svg>
  <div class="dots" id="dots"></div>
  <div class="body abs" style="left:40px;bottom:36px" data-in="13.0">One product, thousands of users. <span class="cream">Rarely meet any of them.</span></div>
</div>
<div class="panel card hot" style="left:1000px" data-in="15.4">
  <div class="h3 amber">An FDE</div>
  <div class="fdeb"><i class="ic icon-amber" data-ic="office" style="width:120px;height:120px"></i><div class="body cream" style="font-size:30px">one client</div><i class="ic" data-ic="user" style="width:56px;height:56px;color:var(--cream)"></i></div>
  <div class="links">
    <div data-in="24.4" data-fx="right"><span class="pill solid">their data</span></div>
    <div data-in="25.2" data-fx="right"><span class="pill solid">their systems</span></div>
    <div data-in="26.6" data-fx="right"><span class="pill solid">their daily tasks</span></div>
  </div>
  <svg class="abs" style="left:340px;top:140px;width:80px;height:280px;overflow:visible">
    <path class="arrow" d="M0 140 C40 140 40 30 78 30" data-draw="24.2" data-ddur="0.5"></path>
    <path class="arrow" d="M0 140 H78" data-draw="25.0" data-ddur="0.5"></path>
    <path class="arrow" d="M0 140 C40 140 40 250 78 250" data-draw="26.4" data-ddur="0.5"></path>
  </svg>
</div>
<div class="brand">stackle.io</div>
<script>
const d=document.getElementById('dots');
for(let i=0;i<48;i++){const e=document.createElement('i');e.dataset.in=(10.2+i*0.035).toFixed(2);e.dataset.fx='scale';d.appendChild(e);}
</script>
<script src="fde.js"></script><script src="../base.js"></script></body></html>
