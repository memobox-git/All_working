<!doctype html>
<!-- A mockup of the talking-head Short style: three frames side by side, with the
     channel-intro photo standing in for Chris's footage. Rendered to
     ../../graphics/rag-short-mockup.jpg. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PJS;font-weight:700;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-700-normal.woff2)}
@font-face{font-family:PJS;font-weight:600;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2)}
@font-face{font-family:PJS;font-weight:800;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2)}
@font-face{font-family:JBM;font-weight:500;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:3400px;height:2040px;background:#1D2939;display:flex;gap:40px;padding:60px 40px;font-family:PJS,sans-serif}
.fr{position:relative;width:1080px;height:1920px;overflow:hidden;border-radius:28px;background:#ddd}
.fr .me{position:absolute;left:-240px;top:0;height:1920px;transform-origin:540px 700px}
.fr.pin .me{transform:scale(1.12)}
.cap{position:absolute;left:0;right:0;top:930px;text-align:center}
.cap span{display:inline-block;padding:10px 22px 12px;border-radius:14px;background:rgba(10,12,18,.62);color:#fff;font-weight:700;font-size:46px;letter-spacing:-.01em}
.prop{position:absolute;right:40px;top:1080px;width:auto;height:520px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.35))}
.card{position:absolute;left:90px;right:90px;top:1120px;padding:34px 36px;border-radius:30px;background:#fff;box-shadow:0 40px 80px -20px rgba(0,0,0,.45)}
.card p{font-weight:600;font-size:40px;line-height:1.35;color:#0B1220}
.card b{color:#067647;font-weight:800}
.cite{display:inline-grid;place-items:center;width:40px;height:40px;margin-left:6px;border-radius:10px;vertical-align:4px;font:500 24px JBM,monospace;color:#fff;background:#12B76A}
.src{display:inline-flex;margin-top:22px;padding:8px 16px;border-radius:12px;font:500 24px JBM,monospace;color:#067647;background:#ECFDF3;border:1.5px solid #ABEFC6}
.who{display:flex;align-items:center;gap:12px;margin-bottom:18px;font:500 22px JBM,monospace;color:#667085;letter-spacing:.08em;text-transform:uppercase}
.who i{width:12px;height:12px;border-radius:50%;background:#12B76A}
.lab{position:absolute;left:0;right:0;top:-46px;text-align:center;color:#D0D5DD;font:500 26px JBM,monospace;letter-spacing:.06em}
.wrap{position:relative}
</style></head><body>
<div class="wrap"><div class="lab">LINE 1 · THE HOOK · SLOW PUSH-IN</div>
<div class="fr"><img class="me" src="../intro-pro/img/chris.jpg"><div class="cap"><span>AI chatbot isn't dumb.</span></div></div></div>
<div class="wrap"><div class="lab">LINE 5 · PUNCH-IN · PROP POPS IN</div>
<div class="fr pin"><img class="me" src="../intro-pro/img/chris.jpg"><div class="cap"><span>a trick called RAG.</span></div><img class="prop" src="img/robot-librarian-preview.png"></div></div>
<div class="wrap"><div class="lab">LINE 12 · WIDE · DIAGRAM CARD</div>
<div class="fr"><img class="me" src="../intro-pro/img/chris.jpg"><div class="cap"><span>a source you can click.</span></div>
<div class="card"><div class="who"><i></i>Assistant</div><p>Refunds are available within <b>30 days</b> of purchase.<span class="cite">1</span></p><span class="src">refund-policy.pdf</span></div></div></div>
</body></html>
