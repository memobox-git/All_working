<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="grid"></div><div class="ring" data-spin="6"></div>
<div class="beat"><div class="tag" data-in="0.1" data-out="2.4" data-fx="left">If you are new here</div>
  <div class="h1" data-in="0.3" data-out="2.4">I am <span class="amber">Chris.</span></div></div>
<div class="beat"><div class="big amber" data-in="2.6" data-out="5.8" data-fx="scale"><span data-count="10" data-cin="2.6" data-suffix="+"></span></div>
  <div class="h2" data-in="2.9" data-out="5.8">years in data engineering</div>
  <div class="bar" data-bar="0.55" data-bin="3.0" data-in="2.9" data-out="5.8"></div></div>
<div class="beat"><div class="big amber" data-in="6" data-out="10.2" data-fx="scale"><span data-count="200" data-cin="6" data-suffix="+"></span></div>
  <div class="h2" data-in="6.3" data-out="10.2">engineers interviewed</div>
  <div class="chips"><div class="chip" data-in="7.0" data-out="10.2">Healthcare</div><div class="chip" data-in="7.4" data-out="10.2">Banking</div>
  <div class="chip" data-in="7.8" data-out="10.2">Automotive</div><div class="chip" data-in="8.2" data-out="10.2">Financial exchanges</div></div></div>
<div class="beat"><div class="tag" data-in="10.4" data-out="13.4" data-fx="left">Today I run</div>
  <div class="big" data-in="10.6" data-out="13.4" data-fx="scale">Stackle<span class="amber">.</span></div>
  <div class="sub" data-in="11.0" data-out="13.4">where I teach data and AI engineering</div></div>
<div class="beat"><div class="big amber" data-in="13.6" data-out="17.3" data-fx="scale"><span data-count="200000" data-cin="13.6" data-suffix="+"></span></div>
  <div class="h2" data-in="13.9" data-out="17.3">people follow me on LinkedIn</div></div>
<div class="brand" data-in="0" data-fx="fade">stackle.io</div>
<script src="base.js"></script></body></html>
